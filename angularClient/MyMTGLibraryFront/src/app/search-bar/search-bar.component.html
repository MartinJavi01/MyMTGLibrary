<header class="topbar">
    <div class="cardSearchDiv">
        <div class="cardSearchContainer">
            <em class="cardSearchText">Search card: </em>
            <input class="searchInput" placeholder="Card name or id">
        </div>

        <span class="authorIndicator">By Javier Martín</span>
        <span class="versionIndicator">Current version: 0.3.0</span>
    </div>

    <div class="menu-tabs">
        <span class="tab" (click)="redirectAndChangeOptionText()" [innerHTML]="[[optionText]]"></span>
        <span class="divider">||</span>
        <span class="tab" (click)="redirect('decks')">Decks</span>
        <span class="divider">||</span>
        <span class="tab" (click)="redirect('storage')">Storage
            <span class="help-icon">?</span>
        </span>
    </div>
</header>

<div class="main">
    <router-outlet/>
</div>
